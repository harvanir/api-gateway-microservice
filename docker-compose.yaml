networks:
  service:
    driver: bridge

services:
  eureka:
    container_name: eureka
    image: eureka
    ports:
      - 8761:8761
    networks:
      - service
    environment:
      JVM_OPT: |-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=90.0
        -Xlog:gc:GC.log -XX:+UseStringDeduplication
        -Dserver.port=8761 -Deureka.instance.hostname=eureka -Deureka.client.serviceUrl.defaultZone=http://eureka2:8762/eureka/,http://eureka3:8763/eureka/
    deploy:
      resources:
        limits:
          memory: 384m
  eureka2:
    container_name: eureka2
    image: eureka
    ports:
      - 8762:8762
    networks:
      - service
    environment:
      JVM_OPT: |-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=90.0
        -Xlog:gc:GC.log -XX:+UseStringDeduplication
        -Dserver.port=8762 -Deureka.instance.hostname=eureka2 -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/,http://eureka3:8763/eureka/
    deploy:
      resources:
        limits:
          memory: 384m
  eureka3:
    container_name: eureka3
    image: eureka
    ports:
      - 8763:8763
    networks:
      - service
    environment:
      JVM_OPT: |-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=90.0
        -Xlog:gc:GC.log -XX:+UseStringDeduplication
        -Dserver.port=8763 -Deureka.instance.hostname=eureka3 -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/,http://eureka2:8762/eureka/
    deploy:
      resources:
        limits:
          memory: 384m

  spring-cloud-gateway:
    container_name: spring-cloud-gateway
    image: spring-cloud-gateway
    ports:
      - 9090:9090
      - 7001:7001
    networks:
      - service
    #    restart: unless-stopped
    depends_on:
      - eureka
    ulimits:
      nproc: 514933
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: 1025 65000
    environment:
      JVM_OPT: |-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=90.0
        -Xlog:gc:GC.log -XX:+UseStringDeduplication
        -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1
        -Dcom.sun.management.jmxremote.port=7001 -Dcom.sun.management.jmxremote.rmi.port=7001
        -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/,http://eureka2:8762/eureka/,http://eureka3:8763/eureka/
    deploy:
      resources:
        limits:
          memory: 384m

  webflux:
    container_name: webflux
    image: webflux
    ports:
      - 8080:8080
      - 7002:7002
    depends_on:
      - eureka
      - spring-cloud-gateway
    networks:
      - service
    ulimits:
      nproc: 514933
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: 1025 65000
    environment:
      JVM_OPT: |-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=90.0
        -Xlog:gc:GC.log -XX:+UseStringDeduplication
        -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1
        -Dcom.sun.management.jmxremote.port=7002 -Dcom.sun.management.jmxremote.rmi.port=7002
        -Dspring.profiles.active=docker
        -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/,http://eureka2:8762/eureka/,http://eureka3:8763/eureka/
    deploy:
      resources:
        limits:
          memory: 350m

  webmvc:
    container_name: webmvc
    image: webmvc
    ports:
      - 8282:8080
      - 7003:7003
    networks:
      - service
    depends_on:
      - eureka
      - spring-cloud-gateway
    ulimits:
      nproc: 514933
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: 1025 65000
    environment:
      JVM_OPT: |-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=90.0
        -Xlog:gc:GC.log -XX:+UseStringDeduplication
        -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1
        -Dcom.sun.management.jmxremote.port=7003 -Dcom.sun.management.jmxremote.rmi.port=7003
        -Dspring.threads.virtual.enabled=true -Dserver.tomcat.threads.max=400
    deploy:
      resources:
        limits:
          memory: 256m

  go-mux:
