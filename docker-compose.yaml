    networks:
      - service
    depends_on:
      - spring-cloud-gateway
    ulimits:
      nproc: 514933
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: 1025 65000
    deploy:
      resources:
        limits:
          memory: 128m

  go-fiber:
